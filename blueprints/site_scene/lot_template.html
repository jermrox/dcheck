<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  html,body{margin:0;height:100%;background:#cfe0ee;font:14px system-ui,sans-serif;color:#13202c;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.93);border:1px solid #9fb2c2;padding:10px 12px;max-width:360px;border-radius:4px}
  #hud h1{font-size:16px;margin:0 0 4px} #hud p{margin:4px 0;font-size:12px;color:#3c4b58}
  #hud button{font:inherit;font-size:12px;margin:6px 6px 0 0;padding:6px 10px;border:1px solid #2a5b8a;background:#fff;color:#2a5b8a;border-radius:3px;cursor:pointer}
  #hud button.on{background:#2a5b8a;color:#fff}
</style></head><body>
<div id="hud"><h1>__TITLE__</h1>
<p id="facts"></p>
<p>Drag to orbit, scroll or pinch to zoom. Toggle layers to look inside. <b>Enter VR</b> (top right) on a Quest: left stick walks, right stick turns, trigger jumps room to room.</p>
<button id="b-roof" class="on">Roof</button><button id="b-l2" class="on">2nd floor</button><button id="b-l1" class="on">1st floor</button><button id="b-ceil">Ceilings</button><button id="b-trees" class="on">Trees</button><button id="b-survey">Survey</button><button id="b-top">Top view</button> <a href="finance/index.html" style="display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#2a5b8a">Money plan &rarr;</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*LOTJS*/</script>
<script>/*XRJS*/</script>
<script>
const D = /*DATA*/null;
document.getElementById('facts').textContent = `Landscape painted on the surveyed lot (driveway, walk, deck, beds from the plot plan) on terrain fitted to its contours (datum ${D.datum}'); press Survey to see the plot plan itself. Finished floor ${D.ffe}' . Ceilings from the official sheet: 10'-1\" first floor, 9'-1\" second, vaulted kitchen, dining, porch and bonus room with beams, raised great-room ceiling; second floor registered on the first by its walls and stair. Roof is a hip massing (no roof plan supplied).`;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.append(r.domElement);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9cbe9); scene.fog = new THREE.Fog(0xc4d9ea, 450, 1400);
{ // sky dome: blue gradient with soft clouds
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#4f86c9'); g.addColorStop(0.55, '#8fbbe6'); g.addColorStop(1, '#dbe9f4'); x.fillStyle = g; x.fillRect(0, 0, 1024, 512);
  let sd = 5; const rr = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(255,255,255,${0.25 + rr() * 0.4})`; x.beginPath(); x.ellipse(rr() * 1024, 80 + rr() * 260, 30 + rr() * 90, 8 + rr() * 18, 0, 0, 6.3); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false, toneMapped: false }));
  sky.position.set(320, -40, 470); scene.add(sky);
}
const cam = new THREE.PerspectiveCamera(42, 1, 1, 5000);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x5f6b48, 0.75));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.15); sun.position.set(140, 260, 620); sun.target.position.set(330, 0, 480); scene.add(sun.target); sun.shadow.bias = -0.0005; sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -230, right: 230, top: 230, bottom: -230, far: 1200 }); scene.add(sun);
const LOT = buildLotScene(D); scene.add(LOT.root);
const { roofG, ceilG, levelGroups } = LOT, E = D.extras;
// camera
const cx = E.foundation.pts.reduce((s, p) => s + p[0], 0) / E.foundation.pts.length, cz = E.foundation.pts.reduce((s, p) => s + p[1], 0) / E.foundation.pts.length, cy = E.foundation.top;
let yaw = 0.5, pitch = 0.55, dist = 190, ptrs = new Map(), pinch = 0; const cv = r.domElement;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); });
cv.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); pinch = 0; });
cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; const pv = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) dist = Math.min(900, Math.max(25, dist * pinch / d)); pinch = d; return; }
  yaw -= (e.clientX - pv.clientX) * 0.006; pitch = Math.min(1.55, Math.max(0.05, pitch + (e.clientY - pv.clientY) * 0.005)); });
cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.min(900, Math.max(25, dist * (1 + e.deltaY * 0.001))); }, { passive: false });
const tog = (id, obj) => { const b = document.getElementById(id); b.onclick = () => { obj.visible = !obj.visible; b.classList.toggle('on', obj.visible); }; };
tog('b-trees', LOT.plantG);
document.getElementById('b-survey').onclick = e => { const on = !e.target.classList.contains('on'); e.target.classList.toggle('on', on); LOT.setGround(on ? 'survey' : 'land'); };
tog('b-roof', roofG); tog('b-ceil', ceilG); tog('b-l2', levelGroups[1]); tog('b-l1', levelGroups[0]);
document.getElementById('b-top').onclick = e => { const on = pitch < 1.5; pitch = on ? 1.55 : 0.55; e.target.classList.toggle('on', on); };
window.__view = (y, p, d) => { yaw = y; pitch = p; dist = d; };
const vrLabel = document.createElement('div'); vrLabel.style.cssText = 'position:absolute;right:12px;top:56px;font:12px system-ui;color:#13202c;background:rgba(255,255,255,.9);padding:4px 8px;border-radius:6px;display:none';
document.body.append(vrLabel);
const XR = addXR({ renderer: r, scene, spots: LOT.spots, floorAt: (x, z, y) => LOT.inside(x, z) ? null : LOT.hAt(x, z),
  onStart: () => { roofG.visible = true; ceilG.visible = true; levelGroups.forEach(g => g.visible = true); },
  onSpot: p => { vrLabel.style.display = ''; vrLabel.textContent = 'VR: ' + p.name; } });
function resize() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop); const c = Math.cos(pitch) * dist; cam.position.set(cx + Math.sin(yaw) * c, cy + Math.sin(pitch) * dist, cz + Math.cos(yaw) * c); cam.lookAt(cx, cy, cz);
  if (window.__vrPreview != null) { XR.go(window.__vrPreview); XR.cam.position.set(0, 1.6, 0); XR.cam.aspect = cam.aspect; XR.cam.updateProjectionMatrix(); r.render(scene, XR.cam); } else r.render(scene, cam); })();
</script></body></html>
